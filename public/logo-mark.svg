<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Academic Royal Indigo to Violet -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Top Cap Diamond Gradient -->
    <linearGradient id="logoCapTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Cap Base Gradient -->
    <linearGradient id="logoCapBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Book Page Gradient -->
    <linearGradient id="logoBookPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Ambient Shadow for Depth -->
    <filter id="logoShadowFilter" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#logoBgGrad)"/>

  <!-- Inner Soft Bevel Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"/>

  <!-- Main Symbol Group with Depth -->
  <g filter="url(#logoShadowFilter)">
    <!-- Open Knowledge Book (Foundation) -->
    <!-- Left Page -->
    <path d="M256 348 C204 338, 144 344, 112 358 C106 360, 102 365, 102 371 L102 414 C102 420, 108 424, 114 421 C144 408, 202 402, 256 414 Z" fill="url(#logoBookPage)"/>
    <!-- Right Page -->
    <path d="M256 348 C308 338, 368 344, 400 358 C406 360, 410 365, 410 371 L410 414 C410 420, 404 424, 398 421 C368 408, 310 402, 256 414 Z" fill="url(#logoBookPage)"/>
    <!-- Page Spine Shading -->
    <path d="M252 348 C254 348, 256 348, 258 348 L258 414 C256 414, 254 414, 252 414 Z" fill="#c7d2fe"/>
    <!-- Golden Bookmark Ribbon Hanging Below -->
    <path d="M248 413 L256 421 L264 413 L264 442 L256 450 L248 442 Z" fill="url(#logoGoldGrad)"/>

    <!-- Skullcap Base / Headband (Underneath Diamond) -->
    <path d="M142 216 C142 216, 142 264, 142 272 C142 316, 194 340, 256 340 C318 340, 370 316, 370 272 C370 264, 370 216, 370 216 C336 242, 298 256, 256 256 C214 256, 176 242, 142 216 Z" fill="url(#logoCapBase)"/>

    <!-- Mortarboard Diamond Rhombus (Prominent Angle) -->
    <polygon points="256,92 446,182 256,270 66,182" fill="url(#logoCapTop)"/>

    <!-- Diamond Under-edge Rim (Gives 3D Thickness to Mortarboard) -->
    <polygon points="66,182 256,270 256,278 66,190" fill="#c7d2fe"/>
    <polygon points="446,182 256,270 256,278 446,190" fill="#a5b4fc"/>

    <!-- Center Button -->
    <circle cx="256" cy="182" r="14" fill="url(#logoGoldGrad)"/>
    <circle cx="254" cy="180" r="5" fill="#fef9c3" opacity="0.8"/>

    <!-- Tassel Cord -->
    <path d="M256 182 C324 186, 414 204, 426 264" fill="none" stroke="url(#logoGoldGrad)" stroke-width="11" stroke-linecap="round"/>

    <!-- Tassel Metal Clasp Ring -->
    <rect x="416" y="264" width="20" height="9" rx="3" fill="#d97706"/>

    <!-- Tassel Brush Fringe -->
    <path d="M417 273 L410 330 C409 336, 412 340, 418 340 C424 340, 428 340, 434 340 C440 340, 443 336, 442 330 L435 273 Z" fill="url(#logoGoldGrad)"/>
    <!-- Tassel Strands Detail -->
    <path d="M426 275 L426 339" stroke="#b45309" stroke-width="1.5" opacity="0.6"/>
  </g>
</svg>
